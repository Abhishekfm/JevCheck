[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevcheck"
version = "0.1.0"
description = "Extract a file and validate it with TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pydantic>=2.5",
    "typesafe-sdk>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fpdf2>=2.7"]

[project.scripts]
jevcheck = "jevcheck.__main__:main"

[tool.setuptools.packages.find]
include = ["jevcheck*"]
